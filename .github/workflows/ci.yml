# GitHub Actions CI Pipeline Template
#
# PURPOSE: Enforce quality gates on every push and PR. No code reaches main without passing.
# CUSTOMISE: Update Node version, package manager, lint/build/test commands for your project.
# SEE ALSO: standards/ci-cd.md for pipeline requirements and standards/git-workflow.md for branching.
#
# This template uses npm. For pnpm, replace `npm ci` with `pnpm install --frozen-lockfile`
# and adjust cache configuration accordingly.

name: CI

on:
  push:
    branches: [main, "feature/*", "fix/*", "hotfix/*", "chore/*"]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Quality Gates: lint, type-check, build, test, security scan
  # ---------------------------------------------------------------------------
  quality:
    name: Lint, Type Check, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --coverage

      - name: Security scan (dependencies)
        run: npm audit --audit-level=high
        continue-on-error: false

