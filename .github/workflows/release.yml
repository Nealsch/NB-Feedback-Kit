# Release Automation
#
# PURPOSE: Automate package versioning and publishing via Changesets.
# SEE ALSO: .changeset/README.md for the manual workflow.
#
# This workflow has two jobs:
#   1. release — Runs on push to main. Opens/updates a "Version Packages" PR
#      that bumps versions and updates CHANGELOGs. When that PR is merged,
#      it publishes the updated packages to npm.
#   2. ci-quality-gate — Ensures typecheck, build, and tests pass before
#      any release is published.
#
# REQUIRED SECRETS:
#   - NPM_TOKEN — npm publish token (automation scope recommended)
#   NPM publishing must be enabled for the @nb-feedback-kit scope.
#
# MVP NOTE: Releases are manual for now — this workflow is the placeholder
# that TASK-013 requires. To activate, add NPM_TOKEN to repo secrets and
# merge a changeset to main.

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Quality gate — verify the codebase builds and type-checks before release
  # ---------------------------------------------------------------------------
  quality:
    name: Typecheck, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # ---------------------------------------------------------------------------
  # Release — version packages and publish (Changesets bot opens Version PR)
  # ---------------------------------------------------------------------------
  release:
    name: Version & Publish
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # for npm provenance (optional but recommended)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Changesets needs full git history

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # `publish` runs when the Version PR is merged (no pending changesets).
          # Otherwise, a Version PR is opened/updated.
          publish: pnpm changeset publish
          version: pnpm changeset version
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}